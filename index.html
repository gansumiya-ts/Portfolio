<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gansumiya — Portfolio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <nav>
      <a href="#home">Home</a>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
      <button id="theme-toggle" aria-label="Toggle theme">🌙</button>
    </nav>
  </header>

  <main>
    <section id="home" class="hero">
      <h1 class="reveal">Hi, I'm Gansumiya</h1>
      <p class="typewriter" data-phrases='["Frontend developer","UX-minded engineer","Open-source enthusiast"]'></p>
      <a class="btn reveal" href="#projects">See my work</a>
    </section>

    <section id="projects" class="projects">
      <h2 class="reveal">Projects</h2>
      <div class="grid">
        <article class="card reveal" data-title="Project A" data-desc="Short description of Project A" data-image="images/placeholder.svg">
          <img src="images/placeholder.svg" alt="Project A">
          <h3>Project A</h3>
          <p class="muted">HTML • CSS • JS</p>
        </article>
        <article class="card reveal" data-title="Project B" data-desc="Short description of Project B" data-image="images/placeholder.svg">
          <img src="images/placeholder.svg" alt="Project B">
          <h3>Project B</h3>
          <p class="muted">JavaScript • APIs</p>
        </article>
        <article class="card reveal" data-title="Project C" data-desc="Short description of Project C" data-image="images/placeholder.svg">
          <img src="images/placeholder.svg" alt="Project C">
          <h3>Project C</h3>
          <p class="muted">CSS • Animations</p>
        </article>
      </div>
    </section>

    <section id="contact" class="contact reveal">
      <h2>Contact</h2>
      <form id="contact-form">
        <input name="name" placeholder="Your name" required>
        <input name="email" type="email" placeholder="Email" required>
        <textarea name="message" placeholder="Message" required></textarea>
        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <!-- Modal for project details -->
  <div id="project-modal" class="modal" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button id="modal-close" class="modal-close" aria-label="Close">✕</button>
      <img id="modal-image" src="" alt="">
      <h3 id="modal-title"></h3>
      <p id="modal-desc"></p>
    </div>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
